<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%8E%BE%3C/text%3E%3C/svg%3E"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#12291c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>球局｜台北市網球</title>
  </head>
  <body>
    <div id="app">
      <main id="tab-map" class="map-page">
        <div id="map" role="region" aria-label="台北市球局地圖"></div>

        <!-- 批 D4a:v2 頂部 overlay(dc L88-106)取代退場的 app-header——浮動品牌磚＋
             台北市 chip＋球友名單鈕(第一列)＋日期／程度／直接加入／篩選 chips(第二列,
             沿用既有 .map-toolbar class 與行動斷點 order 慣例)。整個 overlay
             pointer-events:none,子列各自 pointer-events:auto(見 session.css),
             讓地圖手勢仍能穿透 overlay 的留白處。 -->
        <div class="map-topbar">
          <div class="map-topbar__row">
            <a class="app-brand" href="#tab-map" aria-label="球局首頁">
              <span class="app-brand__dot" aria-hidden="true"></span>
              <span class="app-brand__name">球局地圖</span>
              <span class="app-brand__code" aria-hidden="true">TPE</span>
            </a>
            <div class="city-chip" aria-label="目前城市：台北市">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z"/></svg>
              <span>台北市</span>
            </div>
            <button type="button" id="player-directory-open" data-testid="player-directory-open" class="topbar-icon-button" aria-label="球友名單">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="8" r="3.6"/><path d="M22 21v-1.8a4 4 0 0 0-3-3.85M16.2 4.3a3.6 3.6 0 0 1 0 7.1"/></svg>
            </button>
          </div>

          <section class="map-toolbar" aria-label="尋找球局篩選">
            <button type="button" class="chip" data-date-chip="today" aria-pressed="false">今天</button>
            <button type="button" class="chip" data-date-chip="tomorrow" aria-pressed="false">明天</button>
            <button type="button" class="chip" data-date-chip="weekend" aria-pressed="false">週末</button>
            <button type="button" id="level-chip" class="chip level-chip" aria-expanded="false" aria-haspopup="true" aria-controls="level-popover">
              <span>程度</span>
              <span id="band-label" class="level-chip__value">全部</span>
              <svg class="level-chip__caret" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <button type="button" id="instant-only-chip" class="chip instant-chip" aria-pressed="false">
              <span class="instant-chip__dot" aria-hidden="true"></span><span>直接加入</span>
            </button>
            <button type="button" id="filter-sheet-open" class="chip filter-chip" aria-label="篩選" disabled aria-disabled="true">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
              <span>篩選</span>
            </button>
          </section>
        </div>

        <div id="level-popover" class="level-popover" hidden>
          <p>NTRP 程度篩選</p>
          <div id="band-options"></div>
        </div>

        <!-- 批 D3:右下 44px 控制直欄(dc L81-86);批 D4a 補上「使用我的位置」為第三顆
             (+/− 之後、顯示在線之前),四顆共用同一套 44px 白鈕視覺。toggle 的可讀文字
             放 visually-hidden span,由 sessionViews 同步更新。 -->
        <div id="map-zoom-controls" class="map-zoom-controls">
          <button type="button" id="map-zoom-in" aria-label="放大地圖">+</button>
          <button type="button" id="map-zoom-out" aria-label="縮小地圖">−</button>
          <button type="button" id="use-my-location" aria-label="使用我的位置">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
          </button>
          <button type="button" id="player-layer-toggle" data-testid="player-layer-toggle" aria-pressed="false">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6.2 8-6.2s8 2.2 8 6.2"/></svg>
            <span class="visually-hidden" data-player-layer-text>顯示在線</span>
          </button>
        </div>

        <div class="map-controls">
          <!-- 批 D4a:球友名單鈕(#player-directory-open)已移入頂列;此容器與
               #player-layer-status 保留,只移到 chips 列下方。 -->
          <div class="player-layer-control">
            <p id="player-layer-status" class="player-layer-status" role="status" aria-live="polite" hidden></p>
          </div>

          <div id="map-data-status" role="status" aria-live="polite" hidden></div>
        </div>

        <aside id="nearby-sessions-drawer" class="nearby-sessions" aria-label="附近球局"></aside>
        <span id="nearby-sessions-count-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></span>
      </main>

      <section id="my-sessions-page" class="my-sessions-page" aria-label="我的球局" hidden>
        <div id="my-sessions-root" class="my-sessions-shell" tabindex="-1"></div>
      </section>

      <section id="me-page" class="me-page" aria-label="我" hidden>
        <div id="me-root"></div>
      </section>

      <nav class="bottom-navigation" aria-label="主要導覽">
        <button type="button" id="map-tab" data-testid="map-tab" class="bottom-navigation__item" aria-controls="tab-map" aria-current="page">
          <span aria-hidden="true">⌖</span><span>找球局</span>
        </button>
        <button type="button" id="create-session-tab" data-testid="create-session-tab" class="bottom-navigation__item" aria-controls="sheet-root" aria-haspopup="dialog">
          <span aria-hidden="true">＋</span><span>開球局</span>
        </button>
        <button type="button" id="my-sessions-tab" data-testid="my-sessions-tab" class="bottom-navigation__item" aria-controls="my-sessions-page" aria-current="false" aria-label="我的球局">
          <span aria-hidden="true">◎</span><span>我的球局</span><span id="my-sessions-badge" class="my-sessions-badge" aria-hidden="true" hidden></span><span id="my-sessions-unread-dot" class="my-sessions-unread-dot" aria-hidden="true" hidden></span>
        </button>
        <button type="button" id="me-tab" data-testid="me-tab" class="bottom-navigation__item" aria-controls="me-page" aria-current="false">
          <span aria-hidden="true">●</span><span>我</span>
        </button>
      </nav>
      <span id="my-sessions-badge-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></span>

      <div id="sheet-root"></div>
      <div id="modal-root"></div>
      <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
