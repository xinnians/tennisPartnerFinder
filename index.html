<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#12291c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>球咖｜台北網球</title>
    <meta property="og:title" content="球咖｜台北網球" />
    <meta property="og:description" content="找你的球咖，開你的球局。台北網球公開球局地圖。" />
    <meta property="og:image" content="https://qiuka.tw/og.png" />
    <meta property="og:url" content="https://qiuka.tw/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app">
      <main id="tab-map" class="map-page">
        <div id="map" role="region" aria-label="台北市球局地圖"></div>

        <!-- 批 D4a:v2 頂部 overlay(dc L88-106)取代退場的 app-header——浮動品牌磚＋
             台北市 chip＋球友名單鈕(第一列)＋日期／程度／直接加入／篩選 chips(第二列,
             沿用既有 .map-toolbar class 與行動斷點 order 慣例)。整個 overlay
             pointer-events:none,子列各自 pointer-events:auto(見 session.css),
             讓地圖手勢仍能穿透 overlay 的留白處。 -->
        <div id="map-topbar-root"></div>

        <!-- 批 D3:右下 44px 控制直欄(dc L81-86);批 D4a 補上「使用我的位置」為第三顆
             (+/− 之後、顯示在線之前),四顆共用同一套 44px 白鈕視覺。toggle 的可讀文字
             放 visually-hidden span,由 sessionViews 同步更新。 -->
        <div id="map-zoom-controls" class="map-zoom-controls">
          <button type="button" id="map-zoom-in" aria-label="放大地圖">+</button>
          <button type="button" id="map-zoom-out" aria-label="縮小地圖">−</button>
          <button type="button" id="use-my-location" aria-label="使用我的位置">
            <svg
              width="19"
              height="19"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="7" />
              <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
            </svg>
          </button>
          <button type="button" id="player-layer-toggle" data-testid="player-layer-toggle" aria-pressed="false">
            <svg
              width="19"
              height="19"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="8" r="4" />
              <path d="M4 21c0-4 4-6.2 8-6.2s8 2.2 8 6.2" />
            </svg>
            <span class="visually-hidden" data-player-layer-text>顯示在線</span>
          </button>
        </div>

        <div class="map-controls">
          <!-- 批 D4a:球友名單鈕(#player-directory-open)已移入頂列;此容器與
               #player-layer-status 保留,只移到 chips 列下方。 -->
          <div class="player-layer-control">
            <p id="player-layer-status" class="player-layer-status" role="status" aria-live="polite" hidden></p>
          </div>

          <div id="map-data-status" role="status" aria-live="polite" hidden></div>
        </div>

        <aside id="nearby-sessions-drawer" class="nearby-sessions" aria-label="附近球局"></aside>
        <span
          id="nearby-sessions-count-status"
          class="visually-hidden"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        ></span>
      </main>

      <section id="my-sessions-page" class="my-sessions-page" aria-label="我的球局" hidden>
        <div id="my-sessions-root" class="my-sessions-shell" tabindex="-1"></div>
      </section>

      <section id="me-page" class="me-page" aria-label="我" hidden>
        <div id="me-root"></div>
      </section>

      <!-- 批 D7:訊息頁(dc §3)——群聊列表+未讀點,沿用 my-sessions-page/me-page 的
           hidden 頁面切換慣例。 -->
      <section id="messages-page" class="messages-page" aria-label="訊息" hidden>
        <div id="messages-root" class="messages-shell" tabindex="-1"></div>
      </section>

      <!-- 批 D7:底部導覽改 dc 五格(抽取規格 §1-2)——找球局／我的球局／置中「開球局」
           signal 圓鈕／訊息／我。既有四鈕 id/data-testid/aria-controls/aria-haspopup
           全數保留;create-session-tab 改用獨立的 .bottom-navigation__create 視覺
           (非 .bottom-navigation__item),故 .bottom-navigation__item 的元素數維持 4
           (map/my-sessions/messages/me,不含 create——它從來不是一個「目的地」)。
           #my-sessions-badge(數字徽章,既有 a11y 契約)留在「我的球局」;
           #my-sessions-unread-dot(圓點,批 C4-2)語意改隸屬「訊息」格,搬進
           messages-tab,id 不變(main.js/測試皆以 id 定位,不因搬家而變)。 -->
      <div id="bottom-navigation-root"></div>

      <div id="sheet-root"></div>
      <div id="modal-root"></div>
      <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
